services:
  qdrant:
    image: qdrant/qdrant:v1.12.4
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped

  backend:
    build:
      context: ./backend
    ports:
      - "8000:8000"
    environment:
      # nodes.config.json is mounted from the repo root (single source of truth).
      NODES_CONFIG_PATH: /config/nodes.config.json
      CORS_ORIGINS: http://localhost:3000
      WEATHER_CITY: ${WEATHER_CITY:-Sofia}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      MODEL: ${MODEL:-claude-sonnet-4-6}
      QDRANT_URL: http://qdrant:6333
    volumes:
      - ./nodes.config.json:/config/nodes.config.json:ro
    depends_on:
      - qdrant
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_BACKEND_URL: http://localhost:8000
        NEXT_PUBLIC_WS_URL: ws://localhost:8000/ws
    ports:
      - "3000:3000"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  qdrant_data:
